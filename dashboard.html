<!DOCTYPE html>
<html lang="en">

<head>
  <script>if(localStorage.getItem("wgh-token"))document.documentElement.setAttribute("data-auth","true");</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Windsor Grove Hub</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="apple-touch-icon" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Non-blocking font load: swap media trick avoids render-blocking -->
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap"
    rel="stylesheet" media="print" onload="this.media='all'">
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
  </noscript>
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    /* Skeleton shimmer cards */
    .hotel-skeleton {
      background: #fff;
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .skel-img  { height: 200px; background: linear-gradient(90deg,#f0f0f0 25%,#e0e0e0 50%,#f0f0f0 75%); background-size: 400% 100%; animation: shimmer 1.4s infinite; }
    .skel-body { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .skel-line { border-radius: 6px; background: linear-gradient(90deg,#f0f0f0 25%,#e0e0e0 50%,#f0f0f0 75%); background-size: 400% 100%; animation: shimmer 1.4s infinite; }
    .skel-line.tall  { height: 18px; width: 70%; }
    .skel-line.short { height: 13px; width: 45%; }
    .skel-line.btn   { height: 36px; width: 100%; border-radius: 10px; margin-top: 6px; }
    @keyframes shimmer { 0%{background-position:100% 0} 100%{background-position:-100% 0} }
  </style>
</head>

<body>

          <img src="logo.png" alt="Windsor Grove" style="width:100%; height:100%; object-fit:cover" loading="lazy">
        </div>
        <div>
          <div class="brand-title">WINDSOR GROVE</div>
          <div class="brand-sub">Expert Hotel Intelligence</div>
        </div>
      </div>
      <nav class="header-tab-nav">
        <a href="dashboard.html" class="tab-item active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
          <span>Home</span>
        </a>
        <a href="tasks.html" class="tab-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
          <span>Missions</span>
        </a>
        <a href="account.html" class="tab-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
          <span>Ledger</span>
        </a>
        <a href="support.html" class="tab-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
          <span>Support</span>
        </a>
        <a href="profile.html" class="tab-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          <span>Profile</span>
        </a>
      </nav>
      <div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap; justify-content:flex-end; max-width:100%">
        <button class="btn btn-outline" id="btn-login"
          style="padding: 10px 18px; flex:1 1 auto; white-space:nowrap; text-align:center; min-width:80px">Login</button>
        <button class="btn btn-primary" id="btn-create"
          style="padding: 10px 18px; flex:1 1 auto; white-space:nowrap; text-align:center; min-width:140px">Join Expert
          Circle</button>
        <button class="nav-btn" onclick="window.location.href='how-it-works.html'"
          style="padding: 10px 18px; flex:1 1 auto; white-space:nowrap; text-align:center; min-width:110px">How it
          Works</button>
      </div>
    </div>
  </header>

  <main>
    <div class="container" style="padding: 60px 0">
      <div class="dash-header"
        style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:60px;flex-wrap:wrap;gap:20px">
        <div style="min-width: 240px; max-width: 100%">
          <div class="eyebrow">Intellectual Gathering</div>
          <h2 style="font-size:clamp(1.8rem, 5vw, 2.8rem);margin-top:10px;word-break:break-word">Intelligence <span
              class="grad-text">Dashboard</span></h2>
          <p class="muted" id="stats-text">Monitoring premium properties worldwide</p>
        </div>
        <div class="dash-search-bar"
          style="display:flex;flex-wrap:wrap;align-items:center;gap:12px;background:#fff;padding:8px 14px;border-radius:18px;border:1px solid var(--border);max-width:100%;box-sizing:border-box">
          <input type="text" id="search-input" class="input"
            style="flex:1;min-width:130px;border:none;background:transparent;padding:4px 0"
            placeholder="Property or City...">
          <div class="search-divider" style="width:1px;height:24px;background:var(--border);"></div>
          <select id="country-select" class="select"
            style="flex:1;min-width:120px;max-width:100%;border:none;background:transparent;font-weight:600;padding:4px 0;text-overflow:ellipsis">
            <option value="All">All Regions</option>
          </select>
        </div>
      </div>

      <div class="hotel-grid" id="hotel-grid">
        <!-- Skeleton shimmer placeholders shown immediately -->
      </div>
    </div>
  </main>

  <div class="mobile-tab-bar">
    <a href="dashboard.html" class="tab-item active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
        stroke-linejoin="round">
        <rect x="3" y="3" width="7" height="7"></rect>
        <rect x="14" y="3" width="7" height="7"></rect>
        <rect x="14" y="14" width="7" height="7"></rect>
        <rect x="3" y="14" width="7" height="7"></rect>
      </svg>
      <span>Home</span>
    </a>
    <a href="tasks.html" class="tab-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
        stroke-linejoin="round">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
        <polyline points="22 4 12 14.01 9 11.01"></polyline>
      </svg>
      <span>Missions</span>
    </a>
    <a href="account.html" class="tab-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
        stroke-linejoin="round">
        <line x1="12" y1="1" x2="12" y2="23"></line>
        <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
      </svg>
      <span>Ledger</span>
    </a>
    <a href="support.html" class="tab-item">

        stroke-linejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
      </svg>
      <span>Support</span>
    </a>
    <a href="profile.html" class="tab-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
        stroke-linejoin="round">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
        <circle cx="12" cy="7" r="4"></circle>
      </svg>
      <span>Profile</span>
    </a>
  </div>

  <footer>
    <div class="container foot-inner"></div>
  </footer>

  <div class="toasts" id="toasts"></div>

  <script src="assets/js/core.js"></script>
  <script>
    const grid = document.getElementById("hotel-grid");
    const stats = document.getElementById("stats-text");
    const sInput = document.getElementById("search-input");
    const cSelect = document.getElementById("country-select");

    // Initialize filters from URL
    const params = new URLSearchParams(window.location.search);
    let currentSearch = params.get('loc') || params.get('city') || "";
    let currentRegion = params.get('region') || "All";
    sInput.value = currentSearch;

    // Show skeleton cards immediately so the page doesn't look empty
    function showSkeletons(count = 8) {
      grid.innerHTML = Array.from({length: count}, () => `
        <div class="hotel-skeleton">
          <div class="skel-img"></div>
          <div class="skel-body">
            <div class="skel-line tall"></div>
            <div class="skel-line short"></div>
            <div class="skel-line btn"></div>
          </div>
        </div>
      `).join('');
    }

    // ONE fetch — populate both the region dropdown and the hotel grid
    async function initDashboard() {
      showSkeletons(8);
      try {
        const url = new URL(`${API_URL}/hotels`, window.location.origin);
        if (currentSearch) url.searchParams.set('search', currentSearch);
        if (currentRegion !== 'All') url.searchParams.set('country', currentRegion);

        const res = await fetch(url);
        const hotels = await res.json();

        // Populate region dropdown once (from full data)
        if (cSelect.options.length <= 1) {
          const regions = ["All", ...new Set(hotels.map(h => h.country))];
          cSelect.innerHTML = regions.map(r =>
            `<option value="${r}" ${currentRegion === r ? 'selected' : ''}>${r}</option>`
          ).join("");
        }

        renderGrid(hotels);
      } catch (e) {
        toast("Failed to connect to Windsor Grove API.");
        grid.innerHTML = `<div class="card card-pad muted" style="grid-column:1/-1;text-align:center;padding:60px">Unable to load properties. Please try again.</div>`;
      }
    }

    function renderGrid(hotels) {
      stats.textContent = `Monitoring ${hotels.length} premium properties worldwide`;

      if (hotels.length === 0) {
        grid.innerHTML = `<div class="card card-pad muted" style="grid-column:1/-1;text-align:center;padding:100px">No properties found matching your intelligence parameters.</div>`;
        return;
      }

      grid.innerHTML = hotels.slice(0, 50).map(h => `
        <div class="hotel">
          <div class="hotel-img">
            <img src="${h.image.startsWith('http') ? h.image : 'assets/img/' + h.image}"
              alt="${h.name}" loading="lazy"
              onerror="this.style.display='none';this.parentElement.style.background='linear-gradient(135deg,#1a1a2e,#16213e)'">
            <div class="hotel-badge">${h.category}</div>
          </div>
          <div class="hotel-body">
            <div class="hotel-name">${h.name}</div>
            <div class="hotel-meta">${h.city}, ${h.country}</div>
            <div class="hotel-foot">
              <div>
                <div class="hotel-price">${fmt(h.price)} <span class="muted" style="font-size:12px;font-weight:400">/night</span></div>
                <div class="hotel-earn">Earn ${fmt(h.commission_rate)}</div>
              </div>
              <button class="btn btn-primary" onclick="toast('Go to Missions tab to start your tasks.')" style="padding: 10px 16px">Rate Expertly</button>
            </div>
          </div>
        </div>
      `).join("");
    }

    // Debounced search — avoids firing API on every keystroke
    let _searchTimer = null;
    async function renderDashboard() {
      showSkeletons(8);
      try {
        const url = new URL(`${API_URL}/hotels`, window.location.origin);
        if (currentSearch) url.searchParams.set('search', currentSearch);
        if (currentRegion !== 'All') url.searchParams.set('country', currentRegion);
        const res = await fetch(url);
        renderGrid(await res.json());
      } catch(e) {
        toast("Failed to connect to Windsor Grove API.");
      }
    }

    sInput.oninput = (e) => {
      currentSearch = e.target.value;
      clearTimeout(_searchTimer);
      _searchTimer = setTimeout(renderDashboard, 280);
    };
    cSelect.onchange = (e) => { currentRegion = e.target.value; renderDashboard(); };

    initDashboard();
  </script>
</body>

</html>
