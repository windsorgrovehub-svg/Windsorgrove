<!DOCTYPE html>
<html lang="en">
<head>
  <script>if(localStorage.getItem("wgh-token"))document.documentElement.setAttribute("data-auth","true");</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Withdrawal History | Windsor Grove Hub</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    html,body{max-width:100vw;overflow-x:hidden}
    .container{box-sizing:border-box;width:100%;padding-left:16px;padding-right:16px}
    .back-btn{display:inline-flex;align-items:center;gap:8px;color:var(--text-dim);font-size:14px;font-weight:600;text-decoration:none;margin-bottom:24px;transition:color .2s}
    .back-btn:hover{color:var(--accent1)}
    .pag-btn{padding:8px 16px;border-radius:10px;border:1px solid var(--border);background:#fff;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;font-family:inherit;color:var(--text)}
    .pag-btn:hover:not(:disabled){border-color:var(--accent1);color:var(--accent1)}
    .pag-btn:disabled{opacity:.4;cursor:not-allowed}
  </style>
</head>
<body>
  <div class="loader-wrapper" id="loader"><div class="loader"><div class="loader-ring"></div><div class="loader-text">WINDSOR GROVE</div></div></div>
  <div class="bg-wrap"><div class="bg-gradient"></div><div class="grid-overlay"></div></div>

  <header id="header">
    <div class="container head-inner">
      <div class="brand" id="brand" style="cursor:pointer">
        <div class="logo" style="width:40px;height:40px;border-radius:50%;overflow:hidden;background:var(--bg);border:1px solid var(--border)"><img src="logo.png" alt="Windsor Grove" style="width:100%;height:100%;object-fit:cover"></div>
        <div><div class="brand-title">WINDSOR GROVE</div><div class="brand-sub">Expert Hotel Intelligence</div></div>
      </div>
      <nav class="header-tab-nav">
        <a href="dashboard.html" class="tab-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg><span>Home</span></a>
        <a href="tasks.html" class="tab-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg><span>Missions</span></a>
        <a href="account.html" class="tab-item active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg><span>Ledger</span></a>
        <a href="support.html" class="tab-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg><span>Support</span></a>
        <a href="profile.html" class="tab-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg><span>Profile</span></a>
      </nav>
      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:flex-end">
        <button class="btn btn-outline" id="btn-login" style="padding:10px 18px">Login</button>
        <button class="btn btn-primary" id="btn-create" style="padding:10px 18px">Join Expert Circle</button>
      </div>
    </div>
  </header>

  <main>
    <div class="container" style="padding:40px 0">
      <a href="account.html" class="back-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
        Back to Account
      </a>
      <div style="margin-bottom:28px">
        <div class="eyebrow">Financial Records</div>
        <h2 style="font-size:clamp(1.8rem,6vw,2.8rem);margin-top:10px">Withdrawal <span class="grad-text">History</span></h2>
        <p class="muted" style="margin-top:8px">Track your settlement requests, approvals, and payment statuses.</p>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px">
        <div style="font-size:13px;color:var(--text-dim)" id="pagination-info">Loading…</div>
        <select onchange="changePageSize(this.value)" style="padding:8px 12px;border-radius:10px;border:1px solid var(--border);font-size:13px;background:#fff;cursor:pointer;font-family:inherit;color:var(--text)">
          <option value="25">25 per page</option>
          <option value="50">50 per page</option>
          <option value="100">100 per page</option>
        </select>
      </div>
      <div id="list-body" style="display:flex;flex-direction:column;gap:12px">
        <div class="card card-pad" style="padding:60px 20px;text-align:center;border:1px dashed var(--border);border-radius:20px">
          <div style="font-size:30px;opacity:.4;margin-bottom:10px">⏳</div>
          <div style="font-weight:600;font-size:15px;color:var(--text-dim)">Loading…</div>
        </div>
      </div>
      <div id="pagination-controls" style="display:flex;justify-content:center;align-items:center;gap:12px;margin-top:24px"></div>
    </div>
  </main>

  <div class="mobile-tab-bar">
    <a href="dashboard.html" class="tab-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg><span>Home</span></a>
    <a href="tasks.html" class="tab-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg><span>Missions</span></a>
    <a href="account.html" class="tab-item active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg><span>Ledger</span></a>
    <a href="support.html" class="tab-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg><span>Support</span></a>
    <a href="profile.html" class="tab-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg><span>Profile</span></a>
  </div>

  <footer><div class="container foot-inner"></div></footer>
  <div class="toasts" id="toasts"></div>

  <script src="assets/js/core.js"></script>
  <script>
    const fmt=n=>Number(n).toLocaleString(undefined,{style:"currency",currency:"USD",maximumFractionDigits:2});
    const methodIcon=m=>({bank:'🏦',crypto:'₿',paypal:'💳',wise:'🌐','Bank Transfer':'🏦','Crypto Wallet':'₿'})[m]||'💼';
    const statusStyle=s=>s==='approved'?'background:#d1fae5;color:#059669':s==='rejected'?'background:#fee2e2;color:#dc2626':'background:#fef3c7;color:#d97706';
    const fmtDate=d=>new Date(d).toLocaleDateString(undefined,{dateStyle:'medium'});
    let allItems=[],pageSize=25,currentPage=1;
    window.changePageSize=s=>{pageSize=parseInt(s);currentPage=1;render();};
    window.changePage=d=>{currentPage+=d;render();};
    function render(){
      const total=allItems.length,start=(currentPage-1)*pageSize,end=Math.min(start+pageSize,total),items=allItems.slice(start,end);
      document.getElementById('pagination-info').textContent=total>0?`Showing ${start+1}–${end} of ${total} records`:'No records found';
      const body=document.getElementById('list-body');
      if(!items.length){body.innerHTML=`<div class="card card-pad" style="padding:60px 20px;text-align:center;border:1px dashed var(--border);border-radius:20px"><div style="font-size:30px;margin-bottom:10px;opacity:.5">📤</div><div style="font-weight:600;font-size:15px">No Withdrawal History</div><div style="font-size:13px;color:var(--text-dim);margin-top:6px">Your withdrawal requests will appear here once submitted.</div></div>`;return;}
      body.innerHTML=items.map(r=>`
        <div class="card" style="background:#fff;border-radius:16px;border:1px solid var(--border);padding:16px 18px;display:flex;flex-wrap:wrap;align-items:center;gap:12px">
          <div style="width:40px;height:40px;border-radius:12px;background:#fef2f2;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0">${methodIcon(r.method)}</div>
          <div style="flex:1;min-width:0">
            <div style="font-weight:700;font-size:14px;color:var(--text)">${r.method||'Transfer'}</div>
            <div style="font-size:12px;color:var(--text-dim);margin-top:3px">${fmtDate(r.created_at)}${r.transaction_id?` · <span style="font-family:monospace;font-size:10px">TX:${r.transaction_id.slice(0,14)}…</span>`:''}</div>
          </div>
          <div style="text-align:right;flex-shrink:0">
            <div style="font-weight:800;font-size:15px;color:#dc2626">−${fmt(Math.abs(parseFloat(r.amount)))}</div>
            <span style="display:inline-block;padding:2px 9px;border-radius:20px;font-size:10px;font-weight:700;text-transform:uppercase;${statusStyle(r.status)}">${r.status}</span>
          </div>
        </div>`).join('');
      const ctrl=document.getElementById('pagination-controls');
      if(total>pageSize){const tp=Math.ceil(total/pageSize);ctrl.innerHTML=`<button class="pag-btn" onclick="changePage(-1)" ${currentPage===1?'disabled':''}>← Previous</button><span style="font-size:13px;color:var(--text-dim);font-weight:600">Page ${currentPage} of ${tp}</span><button class="pag-btn" onclick="changePage(1)" ${currentPage===tp?'disabled':''}>Next →</button>`;}
      else ctrl.innerHTML='';
    }
    let _r=0;async function init(){_r++;if(!state.user){if(localStorage.getItem('wgh-token')&&_r<100)setTimeout(init,50);return;}
      try{
        const res=await fetch(`${API_URL}/user/my-requests`,{headers:{'Authorization':`Bearer ${state.token}`}});
        if(res.ok){const data=await res.json();allItems=data.filter(r=>r.type==='withdrawal');}
      }catch(e){}
      render();
    }
    init();
  </script>
</body>
</html>
